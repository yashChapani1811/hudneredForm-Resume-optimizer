<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Career pivot success thumbnail</title>
  <desc id="desc">A career path map showing a successful pivot into a new role.</desc>
  <rect width="1200" height="630" fill="#0A0D1C"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M172 412c132-120 232-120 360-18 132 106 256 82 486-154" stroke="#818CF8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="172" cy="412" r="34" fill="#C7D2FE"/>
  <circle cx="532" cy="394" r="34" fill="#A78BFA"/>
