<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HundredForm - AI Resume Optimizer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#2563EB',
                        'primary-purple': '#7C3AED',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 1s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Glassmorphism Styles */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .glow-button {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .glow-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .glow-button:hover::before {
            left: 100%;
        }
        
        .glow-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body class="overflow-hidden">
    <!-- Hero Section -->
    <section class="relative min-h-screen flex items-center justify-center px-6 py-20">
        <!-- Background Gradient -->
        <div class="absolute inset-0 bg-gradient-to-br from-primary-blue via-primary-purple to-primary-blue"></div>
        
        <!-- Background Glow Effects -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute top-0 left-1/4 w-96 h-96 bg-white/10 rounded-full blur-3xl float-animation"></div>
            <div class="absolute top-1/3 right-1/4 w-80 h-80 bg-white/8 rounded-full blur-3xl float-animation" style="animation-delay: 2s;"></div>
            <div class="absolute bottom-0 left-1/3 w-64 h-64 bg-white/6 rounded-full blur-2xl float-animation" style="animation-delay: 4s;"></div>
        </div>
        
        <!-- Content Container (Centered) -->
        <div class="relative z-10 max-w-4xl mx-auto text-center animate-fade-in">
            
            <!-- Large Heading (Centered) -->
            <h1 class="text-5xl md:text-7xl font-black text-white mb-6 leading-tight">
                Make Your Resume
                <span class="gradient-text">100%</span> Perfect
            </h1>
            
            <!-- Subheading (Below Heading) -->
            <p class="text-xl md:text-2xl text-white/90 mb-12 max-w-3xl mx-auto leading-relaxed">
                Upload your resume and get instant AI-powered analysis, score, and improvement suggestions.
            </p>
            
            <!-- Upload Box (Centered, Glassmorphism) -->
            <div class="glass rounded-2xl p-8 max-w-2xl mx-auto mb-8">
                <div id="uploadArea" class="border-2 border-dashed border-white/30 rounded-xl p-12 text-center hover:border-white/50 transition-all duration-300 cursor-pointer bg-white/5">
                    <!-- Upload Icon -->
                    <div class="mb-6">
                        <div class="w-20 h-20 bg-gradient-to-r from-primary-blue to-primary-purple rounded-2xl flex items-center justify-center mx-auto mb-4">
                            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                        </div>
                    </div>
                    
                    <!-- Drag & Drop Text -->
                    <p class="text-white font-semibold text-lg mb-2">Drag & Drop your resume</p>
                    <p class="text-white/70 text-sm mb-4">or click to browse</p>
                    
                    <!-- File Input (Hidden) -->
                    <input type="file" id="fileInput" class="hidden" accept=".pdf,.doc,.docx" onchange="handleFileUpload(event)">
                    
                    <!-- Upload Button -->
                    <button onclick="document.getElementById('fileInput').click()" class="glass px-6 py-3 rounded-full text-white font-semibold hover:bg-white/20 transition-all duration-300">
                        Choose File
                    </button>
                </div>
            </div>
            
            <!-- CTA Button (Below Upload Box) -->
            <button onclick="document.getElementById('fileInput').click()" class="glow-button bg-gradient-to-r from-primary-blue to-primary-purple text-white px-8 py-4 rounded-full text-lg font-bold mb-12">
                Analyze My Resume Now
            </button>
            
            <!-- Stats Section (Below CTA, Row Layout) -->
            <div class="flex flex-wrap justify-center items-center gap-6 md:gap-12">
                <!-- Success Rate -->
                <div class="text-center">
                    <div class="text-3xl md:text-4xl font-bold text-white mb-1">95%</div>
                    <div class="text-white/70 text-sm">Success Rate</div>
                </div>
                
                <!-- Resumes Optimized -->
                <div class="text-center">
                    <div class="text-3xl md:text-4xl font-bold text-white mb-1">50K+</div>
                    <div class="text-white/70 text-sm">Resumes Optimized</div>
                </div>
                
                <!-- Rating -->
                <div class="text-center">
                    <div class="text-3xl md:text-4xl font-bold text-white mb-1">4.9★</div>
                    <div class="text-white/70 text-sm">User Rating</div>
                </div>
            </div>
            
        </div>
    </section>

    <!-- JavaScript -->
    <script>
        // File Upload Handler
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                // Validate file type
                const allowedTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
                if (!allowedTypes.includes(file.type)) {
                    showNotification('Please upload a PDF, DOC, or DOCX file', 'error');
                    return;
                }
                
                // Validate file size (10MB max)
                if (file.size > 10 * 1024 * 1024) {
                    showNotification('File size must be less than 10MB', 'error');
                    return;
                }
                
                // Simulate upload and analysis
                showNotification('Uploading and analyzing your resume...', 'info');
                
                setTimeout(() => {
                    showNotification('Analysis complete! Your resume score: 92/100', 'success');
                }, 3000);
            }
        }
        
        // Notification System
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg text-white z-50 transition-all duration-300 transform translate-x-full`;
            
            if (type === 'success') {
                notification.classList.add('bg-green-500');
            } else if (type === 'error') {
                notification.classList.add('bg-red-500');
            } else {
                notification.classList.add('bg-blue-500');
            }
            
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // Animate in
            setTimeout(() => {
                notification.classList.remove('translate-x-full');
            }, 100);
            
            // Remove after 5 seconds
            setTimeout(() => {
                notification.classList.add('translate-x-full');
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 5000);
        }
        
        // Drag and Drop Functionality
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        
        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        // Highlight drop area when item is dragged over it
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, highlight, false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, unhighlight, false);
        });
        
        function highlight(e) {
            uploadArea.classList.add('bg-white/10');
        }
        
        function unhighlight(e) {
            uploadArea.classList.remove('bg-white/10');
        }
        
        // Handle dropped files
        uploadArea.addEventListener('drop', handleDrop, false);
        
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if (files.length > 0) {
                fileInput.files = files;
                handleFileUpload({ target: fileInput });
            }
        }
        
        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
    </script>
</body>
</html>
